name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    permissions:
      contents: read
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install -r requirements-dev.txt httpx GitPython

    - name: Run hermetic tests
      run: |
        python -m pytest tests/ -q -m "not integration"

    - name: Install skills-ref
      run: |
        pip install git+https://github.com/agentskills/agentskills@83021e2be457a9b6679148719c1f6074f0ad975e#subdirectory=skills-ref

    - name: Validate skills with skills-ref
      shell: pwsh
      run: |
        $dirs = Get-ChildItem skills -Directory
        if ($dirs.Count -eq 0) { throw 'no skills found' }
        $dirs | ForEach-Object {
          skills-ref validate $_.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }
        }

    - name: Smoke checks
      run: |
        python skills/edcopilot-system-content/scripts/edcg.py version
        python skills/edcopilot-system-content/scripts/edcg.py --help