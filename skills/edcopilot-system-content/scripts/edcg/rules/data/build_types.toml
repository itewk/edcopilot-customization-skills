# The colonisation facility catalogue, as Raven Colonial lists it.
#
# Source: https://ravencolonial.com/#table  (retrieved 2026-10-17)
# The site pull reads the same data; this is the offline copy the validator
# uses, so that a rule can be enforced without a network call.
#
# The class decides the one thing content cares about: whether a player can
# land there. The facility name is Raven's label for the build type, kept so a
# build type can be read back in the game's own terms; nothing reads it.
#
#   starport      large pads           landable
#   outpost       medium or large pad  landable
#   settlement    small, medium or
#                 large pads           landable
#   hub           no pads at all       NOT landable
#   installation  no pads at all       NOT landable
#
# A hub or an installation has no landing pads, so EDCoPilot plays no station
# greeting, station chatter or station fact for it: that content can never be
# heard by anybody. Classify by build type, never by the in-game name, because
# landable stations are named "Hub" and "Installation" too.
#
# Raven also carries five unresolved placeholders (Unknown, "Installation?",
# "Outpost?", "Settlement?", "Facility?"). They are deliberately absent here: a
# site whose build type is not in this file is a warning, not a pass.

version = 1

[classes.starport]
# Large Planetary Port
"aphrodite" = "Large Planetary Port"
"hera" = "Large Planetary Port"
"poseidon" = "Large Planetary Port"
"zeus" = "Large Planetary Port"
