# Placement: whether the facility stands on a body surface or orbits the body.
#
# This is a property of the build type, not of the facility class. Outposts
# and starports exist in both variants: "Scientific Outpost" orbits while
# "Scientific Surface Outpost" is on the ground, and "Large Planetary Port"
# is on the ground while every other starport orbits. Hubs and settlements are
# surface builds; installations orbit.
#
# Source: the orbital flag in Raven Colonial's build table
# (https://ravencolonial.com/#table, retrieved 2026-10-24).

